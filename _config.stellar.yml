# Stellar v2 主题配置（2026-10-08 迁移，同日改为「跟随最新版默认 UI」策略）
# 原则：只覆盖站点身份与内容必需项，其余全部继承 node_modules/hexo-theme-stellar/_config.yml 默认值。
# v2 默认：左栏七项菜单（博客/分类/标签/专栏/归档/友链/关于）、card 外观预设、reveal 动画开、系统字体。

# 左栏品牌（站点身份；name 为 null 时自动继承 Hexo title「ZalexK」）
leftbar:
  brand:
    image:
      src: /images/icon.ico
      variant: icon

# 内容必需：文章里的公式与 Mermaid 图表（页面级 render.math / render.diagrams 引用）
features:
  math:
    provider: mathjax
  diagrams:
    provider: mermaid
